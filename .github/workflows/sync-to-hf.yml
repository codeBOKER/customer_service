name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  # هذا السطر يسمح لك بتشغيل السكربت يدوياً من واجهة جيتهاب إذا أردت
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Prepare Hugging Face README
        run: |
          cp README_HF.md README.md

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # HF rejects binary files — exclude media/ from the push
          echo "media/" >> .gitignore
          git rm -r --cached media/ 2>/dev/null || true
          
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/codeBOKER/customer_service
          
          git commit -am "Update README for HF" || echo "No changes to commit"
          git push -f hf main