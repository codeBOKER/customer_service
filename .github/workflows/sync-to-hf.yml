name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  # هذا السطر يسمح لك بتشغيل السكربت يدوياً من واجهة جيتهاب إذا أردت
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Prepare Hugging Face README
        run: |
          cp README_HF.md README.md

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/codeBOKER/customer_service
          
          # Create an orphan branch so binary files in prior history aren't pushed
          git checkout --orphan hf-clean
          
          # Copy HF-specific README
          cp README_HF.md README.md
          
          # Stage everything except media/ and other unnecessary dirs
          git add -A
          git reset -- media/ .github/ .venv/ venv/ __pycache__/ .env 2>/dev/null || true
          
          git commit -m "Update for HF"
          git push -f hf hf-clean:main